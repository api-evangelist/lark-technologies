aid: lark-technologies
name: Lark
description: 'Lark Health (Lark Technologies, Inc.) is a Mountain View, California
  digital health company founded in 2011 by Julia Hu and Jeff Zira. Lark delivers
  AI-powered, conversational chronic disease prevention and management programs —
  diabetes prevention (CDC-recognized DPP and Medicare MDPP), diabetes management,
  hypertension and heart health, GLP-1 and weight management, and a combined
  cardiometabolic program — through a text-message-style mobile app backed by
  connected devices and human coaching, sold to health plans, employers, PBMs and
  brokers. Lark publishes no public developer API, SDK, or machine-readable API
  specification: there is no developer portal, no api./developer. host, and the
  "Lark API" appears only as an internal component on the Lark Technologies status
  page, with partner integration handled through enterprise agreements. The company
  does publish a canonical llms.txt for AI tools, a responsible disclosure policy
  with a small bug bounty, a public status page, and a security page asserting SOC 2
  Type II and HITRUST certification plus HIPAA Business Associate status.'
